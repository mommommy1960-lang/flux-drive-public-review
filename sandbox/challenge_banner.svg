<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Find the phantom force: synthetic trace challenge</title>
  <desc id="desc">Four stylized mystery traces on a dark grid, inviting participants to identify artifacts and missing evidence. All traces are fictional.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#07111f"/><stop offset=".55" stop-color="#10253a"/><stop offset="1" stop-color="#081322"/>
    </linearGradient>
    <linearGradient id="glow" x2="1">
      <stop stop-color="#48e7ed"/><stop offset=".5" stop-color="#7d9cff"/><stop offset="1" stop-color="#e68eff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5d7896" stroke-opacity=".16"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1015" cy="115" r="210" fill="#24c6da" opacity=".09" filter="url(#blur)"/>
  <path d="M64 60h260" stroke="url(#glow)" stroke-width="5" stroke-linecap="round"/>
  <text x="64" y="115" fill="#b9cadc" font-family="Arial,sans-serif" font-size="24" letter-spacing="4">FLUX / OPEN CHALLENGE</text>
  <text x="64" y="190" fill="#ffffff" font-family="Arial,sans-serif" font-size="67" font-weight="700">FIND THE</text>
  <text x="64" y="265" fill="url(#glow)" font-family="Arial,sans-serif" font-size="67" font-weight="700">PHANTOM FORCE</text>
  <text x="67" y="318" fill="#c9d8e8" font-family="Arial,sans-serif" font-size="25">Run the traces. Break the detector. Show your evidence.</text>
  <g fill="#0c1b2e" stroke="#36546c" stroke-width="2">
    <rect x="65" y="363" width="245" height="148" rx="18"/>
    <rect x="330" y="363" width="245" height="148" rx="18"/>
    <rect x="595" y="363" width="245" height="148" rx="18"/>
    <rect x="860" y="363" width="245" height="148" rx="18"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#dbe9f7" font-size="23" font-weight="700">
    <text x="88" y="401">RUN A</text><text x="353" y="401">RUN B</text>
    <text x="618" y="401">RUN C</text><text x="883" y="401">RUN D</text>
  </g>
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 465l35-16 32 5 30-26 29 10 27-7 40 14" stroke="#48e7ed"/>
    <path d="M355 470l32-16 35-5 32-30 30 4 31 17 35-6" stroke="#8ea9ff"/>
    <path d="M620 465l31-13 30 7 33-28 33 9 27-3 39 8" stroke="#e68eff"/>
    <path d="M885 470l31-12 32-2 33-33 30 7 28 2 42-10" stroke="#ffcf78"/>
  </g>
  <rect x="65" y="547" width="245" height="43" rx="21" fill="#143e49" stroke="#4ee0df"/>
  <text x="88" y="575" fill="#c6ffff" font-family="Arial,sans-serif" font-size="18" font-weight="700">SYNTHETIC DATA ONLY</text>
  <text x="730" y="577" fill="#a7bed1" font-family="Arial,sans-serif" font-size="20">No physical thrust claim</text>
</svg>
