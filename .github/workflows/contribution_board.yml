name: Update synthetic contribution board
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild opt-in board
        env:
          GH_TOKEN: ${{ github.token }}
        run: python sandbox/contribution_board.py
